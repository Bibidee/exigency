name: deployment-health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check hosted routes
        run: |
          set -euo pipefail
          for url in https://exigency.vercel.app/ https://exigency.vercel.app/command https://exigency.vercel.app/vault; do
            curl --fail --silent --show-error --location --max-time 20 "$url" >/dev/null
          done
      - name: Check Studionet RPC
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"gen_getChainId","params":[]}' \
            https://studio.genlayer.com/api >/dev/null
