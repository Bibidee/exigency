name: deployment-health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check hosted routes, RPC, and contract wiring
        run: npm run health:check
      - name: Verify deployed contract sources
        run: npm run source:verify
